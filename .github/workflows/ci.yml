name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (.NET) – Build & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Wortlet.slnx
      - run: dotnet build Wortlet.slnx --no-restore -c Release
      - name: Tests
        run: dotnet test Wortlet.slnx --no-build -c Release --logger "console;verbosity=normal"

  frontend:
    name: Frontend (React) – Typecheck, Tests, Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: End-to-End (Docker + Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: App mit simuliertem OpenRouter starten
        run: docker compose -f docker-compose.yml -f e2e/docker-compose.e2e.yml up --build -d
      - name: Warten bis die App antwortet
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/health; then echo; exit 0; fi
            sleep 2
          done
          docker compose -f docker-compose.yml -f e2e/docker-compose.e2e.yml logs
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Playwright installieren
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: End-to-End-Test
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:8080
        run: npx playwright test
      - name: Container-Logs
        if: always()
        run: docker compose -f docker-compose.yml -f e2e/docker-compose.e2e.yml logs --no-color | tail -n 300
      - name: Screenshots und Bericht hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-ergebnisse
          path: |
            frontend/test-results
            frontend/playwright-report
          retention-days: 14
